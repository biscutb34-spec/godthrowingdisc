name: ThrowingDiscs
version: 1.2.0
main: net.throwingdiscs.plugin.ThrowingDiscsPlugin
api-version: '1.21'
description: Paper plugin recreation of the Throwing Discs Fabric mod.
commands:
  throwingdiscs:
    description: Give or list throwing discs
    usage: /throwingdiscs <get|give|list>
    aliases: [td, disc]
    permission: throwingdiscs.admin
permissions:
  throwingdiscs.admin:
    description: Allows using /throwingdiscs commands
    default: op
  throwingdiscs.use:
    description: Allows throwing discs
    default: true
